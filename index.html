<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Testowa Aplikacja</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TestApp">
<meta name="theme-color" content="#2563eb">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f4f6fb 0%, #e9edf7 100%);
  }
  .container {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px;
    padding-top: max(32px, env(safe-area-inset-top));
    gap: 20px;
  }
  .display-text {
    font-size: 28px;
    font-weight: 600;
    color: #1f2937;
    text-align: center;
    min-height: 40px;
    word-break: break-word;
    max-width: 90%;
  }
  #userInput {
    width: 100%;
    max-width: 320px;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    background: #ffffff;
    outline: none;
  }
  #userInput:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  #clickButton {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #2563eb;
    border: none;
    border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
  }
  #clickButton:active {
    background: #1d4ed8;
    transform: scale(0.98);
  }
  #scanButton {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #16a34a;
    border: none;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  #scanButton:active {
    background: #15803d;
    transform: scale(0.98);
  }

  /* Pelnoekranowy podglad kamery ze skanerem kodow kreskowych */
  #scannerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000;
    z-index: 9999;
    overflow: hidden;
  }
  #scannerOverlay.active {
    display: block;
  }
  #scannerVideo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000000;
  }
  .scannerIconButton {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: #ffffff;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .scannerIconButton.active {
    background: rgba(250, 204, 21, 0.85);
    color: #1f2937;
  }
  .scannerIconButton[hidden] {
    display: none;
  }
  #scannerTopLeftControls {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    left: 16px;
    display: flex;
    gap: 10px;
    z-index: 3;
  }
  #scannerCloseButton {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 3;
  }
  #scannedCodeDisplay {
    position: absolute;
    top: max(64px, calc(env(safe-area-inset-top) + 48px));
    left: 50%;
    transform: translateX(-50%);
    max-width: 88%;
    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    word-break: break-word;
    z-index: 2;
  }
  #scannerDebugInfo {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: max(230px, calc(env(safe-area-inset-bottom) + 214px));
    max-height: 120px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.6);
    color: #a7f3d0;
    font-family: monospace;
    font-size: 11px;
    line-height: 1.4;
    padding: 8px 10px;
    border-radius: 10px;
    z-index: 2;
    word-break: break-word;
    white-space: pre-wrap;
  }
  #scannerDebugInfo[hidden] {
    display: none;
  }
  #confirmScanButton {
    position: absolute;
    bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px));
    left: 50%;
    transform: translateX(-50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    border: 2px solid rgba(255, 255, 255, 0.65);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    z-index: 3;
  }
  #confirmScanButton.ready {
    opacity: 1;
    pointer-events: auto;
  }
  #confirmScanButton svg {
    width: 34px;
    height: 34px;
  }
  #focusControl {
    display: none;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(140px, calc(env(safe-area-inset-bottom) + 124px));
    width: 80%;
    max-width: 320px;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 14px;
    border-radius: 20px;
    z-index: 2;
  }
  #focusControl.visible {
    display: flex;
  }
  #focusControl span {
    color: #ffffff;
    font-size: 13px;
    white-space: nowrap;
  }
  #focusRange {
    flex: 1;
  }

  /* Ramka celownika - obszar, ktory jest analizowany i na ktorym ustawiana jest ostrosc */
  #scanFrame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78%;
    height: 30%;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 14px;
    pointer-events: none;
    z-index: 1;
  }
  #scanFrame::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 5%;
    right: 5%;
    height: 2px;
    background: rgba(239, 68, 68, 0.75);
    transform: translateY(-50%);
  }
  #focusStatus {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(128px, calc(env(safe-area-inset-bottom) + 112px));
    max-width: 88%;
    background: rgba(0, 0, 0, 0.5);
    color: #e2e8f0;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 13px;
    text-align: center;
    z-index: 2;
  }
</style>
</head>
<body>
<div class="container">
  <div id="displayText" class="display-text">Witaj!</div>
  <input type="text" id="userInput" placeholder="Wpisz tutaj tekst..." autocomplete="off" autocapitalize="off">
  <button id="clickButton">Kliknij mnie</button>
  <button id="scanButton">📷 Skanuj kod kreskowy</button>
</div>

<div id="scannerOverlay">
  <video id="scannerVideo" autoplay playsinline muted></video>

  <div id="scanFrame"></div>

  <div id="scannerTopLeftControls">
    <button id="torchButton" class="scannerIconButton" aria-label="Włącz/wyłącz latarkę" hidden>🔦</button>
    <button id="afButton" class="scannerIconButton" aria-label="Ustaw ostrość ponownie" hidden>🎯</button>
    <button id="manualFocusButton" class="scannerIconButton" aria-label="Ręczna ostrość" hidden>✋</button>
    <button id="debugToggleButton" class="scannerIconButton" aria-label="Diagnostyka">🛈</button>
  </div>
  <button id="scannerCloseButton" class="scannerIconButton" aria-label="Zamknij skaner">✕</button>

  <div id="scannedCodeDisplay">Szukam kodu...</div>

  <div id="focusStatus">Uruchamiam aparat...</div>

  <div id="scannerDebugInfo" hidden>Diagnostyka wyłączona.</div>

  <div id="focusControl">
    <span>Daleko</span>
    <input type="range" id="focusRange" min="0" max="15" step="0.1" value="0">
    <span>Blisko</span>
  </div>

  <button id="confirmScanButton" aria-label="Wpisz odczytany kod">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="5" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="7" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="10" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="12" y="4" width="2.2" height="16" fill="#ffffff"/>
      <rect x="15.5" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="17.5" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="20.5" y="4" width="1.2" height="16" fill="#ffffff"/>
    </svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.0/umd/index.min.js"></script>
<script>
  document.getElementById('clickButton').addEventListener('click', function () {
    var val = document.getElementById('userInput').value;
    document.getElementById('displayText').textContent = val.length > 0 ? val : '(puste pole)';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function (err) {
        console.log('Rejestracja service workera nie powiodła się:', err);
      });
    });
  }

  // =====================================================================
  //  Skaner kodów kreskowych
  //
  //  Podglad z kamery obslugujemy sami (getUserMedia + wlasna petla),
  //  a ZXinga uzywamy tylko do dekodowania pojedynczej klatki. Dzieki temu
  //  mamy pelna kontrole nad sciezka wideo i mozemy:
  //   - mierzyc ostrosc srodka kadru klatka po klatce,
  //   - sterowac ostroscia kamery na podstawie tego pomiaru (autofokus
  //     programowy dla Androidow, ktore nie daja dzialajacego autofokusu
  //     sprzetowego przez WWW),
  //   - dekodowac tylko wycinek obrazu (szybciej i bez tla dookola).
  // =====================================================================

  var scannerOverlay = document.getElementById('scannerOverlay');
  var scannerVideo = document.getElementById('scannerVideo');
  var scannedCodeDisplay = document.getElementById('scannedCodeDisplay');
  var confirmScanButton = document.getElementById('confirmScanButton');
  var scanButton = document.getElementById('scanButton');
  var scannerCloseButton = document.getElementById('scannerCloseButton');
  var torchButton = document.getElementById('torchButton');
  var afButton = document.getElementById('afButton');
  var manualFocusButton = document.getElementById('manualFocusButton');
  var debugToggleButton = document.getElementById('debugToggleButton');
  var scannerDebugInfo = document.getElementById('scannerDebugInfo');
  var focusStatus = document.getElementById('focusStatus');
  var focusControl = document.getElementById('focusControl');
  var focusRange = document.getElementById('focusRange');

  var ZX = (typeof ZXing !== 'undefined') ? ZXing : null;
  var barcodeReader = null;
  var decodeHints = null;

  if (ZX) {
    decodeHints = new Map();
    // TRY_HARDER kaze ZXingowi analizowac klatke dokladniej, a przy kodach 1D
    // dodatkowo sprobowac jej obroconej o 90 stopni - dzieki temu kod czytany
    // jest zarowno w poziomie, jak i w pionie
    decodeHints.set(ZX.DecodeHintType.TRY_HARDER, true);
    decodeHints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [
      ZX.BarcodeFormat.EAN_13,
      ZX.BarcodeFormat.EAN_8,
      ZX.BarcodeFormat.UPC_A,
      ZX.BarcodeFormat.UPC_E,
      ZX.BarcodeFormat.CODE_128,
      ZX.BarcodeFormat.CODE_39,
      ZX.BarcodeFormat.CODE_93,
      ZX.BarcodeFormat.ITF,
      ZX.BarcodeFormat.CODABAR,
      ZX.BarcodeFormat.QR_CODE,
      ZX.BarcodeFormat.DATA_MATRIX
    ]);
    barcodeReader = new ZX.MultiFormatReader();
    barcodeReader.setHints(decodeHints);
  }

  var decodeCanvas = document.createElement('canvas');
  var decodeCtx = decodeCanvas.getContext('2d', { willReadFrequently: true });
  var focusCanvas = document.createElement('canvas');
  var focusCtx = focusCanvas.getContext('2d', { willReadFrequently: true });

  var mediaStream = null;
  var currentTrack = null;
  var currentCapabilities = {};
  var lastDecodedText = null;
  var lastGoodTs = 0;
  var lastSharpness = 0;
  var torchOn = false;
  var scanTimer = null;
  var scannerActive = false;
  var manualPanelVisible = false;
  var tickCount = 0;

  var focusState = {
    strategy: 'none',    // hw-poi | hw-continuous | hw-single | sw-sweep | none
    applyVariant: -1,    // ktory sposob podania focusDistance dziala na tym telefonie
    manualSupported: false,
    distanceMin: 0,
    distanceMax: 12,
    distanceStep: 0.05,
    best: null,
    bestScore: 0,
    busy: false,
    lastActionTs: 0,
    note: ''
  };

  function sleep(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function setFocusStatus(text) {
    focusStatus.textContent = text;
  }

  function tryConstraints(c) {
    if (!currentTrack) {
      return Promise.resolve(false);
    }
    try {
      return currentTrack.applyConstraints(c).then(function () {
        return true;
      }, function () {
        return false;
      });
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function readSettings() {
    if (!currentTrack || typeof currentTrack.getSettings !== 'function') {
      return {};
    }
    try {
      return currentTrack.getSettings() || {};
    } catch (e) {
      return {};
    }
  }

  // -------------------------------------------------------------------
  //  Ustawianie ostrosci na konkretna odleglosc
  //
  //  Chrome na Androidzie potrafi po cichu zignorowac ograniczenia ostrosci
  //  podane w jeden sposob, a przyjac dokladnie te same podane inaczej -
  //  i wlasnie dlatego poprzedni suwak nic nie zmienial w focusDistance.
  //  Przy pierwszym uzyciu przechodzimy wiec po kolejnych wariantach zapisu
  //  i zapamietujemy ten, po ktorym kamera faktycznie raportuje nowa wartosc.
  // -------------------------------------------------------------------
  function applyDistanceVariant(variant, value) {
    if (variant === 0) {
      return tryConstraints({ advanced: [{ focusMode: 'manual', focusDistance: value }] });
    }
    if (variant === 1) {
      return tryConstraints({ focusMode: 'manual', focusDistance: value });
    }
    if (variant === 2) {
      return tryConstraints({ advanced: [{ focusMode: 'manual' }] }).then(function () {
        return tryConstraints({ advanced: [{ focusDistance: value }] });
      });
    }
    return tryConstraints({ focusMode: 'manual' }).then(function () {
      return tryConstraints({ focusDistance: value });
    });
  }

  function setFocusDistance(value) {
    if (!currentTrack || !focusState.manualSupported) {
      return Promise.resolve(false);
    }
    if (focusState.applyVariant >= 0) {
      return applyDistanceVariant(focusState.applyVariant, value);
    }
    var variants = [0, 1, 2, 3];
    var idx = 0;

    function next() {
      if (idx >= variants.length) {
        focusState.note = 'telefon ignoruje focusDistance';
        return Promise.resolve(false);
      }
      var variant = variants[idx++];
      return applyDistanceVariant(variant, value).then(function (ok) {
        if (!ok) {
          return next();
        }
        return sleep(160).then(function () {
          var s = readSettings();
          if (typeof s.focusDistance !== 'number') {
            // telefon nie raportuje tej wartosci - nie ma jak sprawdzic,
            // wiec przyjmujemy pierwszy wariant, ktory nie zostal odrzucony
            focusState.applyVariant = variant;
            focusState.note = 'brak odczytu focusDistance';
            return true;
          }
          if (Math.abs(s.focusDistance - value) <= Math.max(0.01, focusState.distanceStep * 2)) {
            focusState.applyVariant = variant;
            focusState.note = '';
            return true;
          }
          return next();
        });
      });
    }

    return next();
  }

  function applyFocusMode(mode, extra) {
    var obj = { focusMode: mode };
    if (extra) {
      for (var k in extra) {
        if (Object.prototype.hasOwnProperty.call(extra, k)) {
          obj[k] = extra[k];
        }
      }
    }
    return tryConstraints({ advanced: [obj] }).then(function () {
      return sleep(90);
    }).then(function () {
      if (readSettings().focusMode === mode) {
        return true;
      }
      return tryConstraints(obj).then(function () {
        return sleep(90);
      }).then(function () {
        return readSettings().focusMode === mode;
      });
    });
  }

  // -------------------------------------------------------------------
  //  Pomiar ostrosci srodka kadru
  //
  //  Liczony na wycinku 1:1 z oryginalnej rozdzielczosci (bez skalowania -
  //  skalowanie zamazuje wlasnie te informacje, ktora tu mierzymy).
  //  Miara to srednia z kwadratow roznic jasnosci sasiednich pikseli,
  //  znormalizowana wzgledem jasnosci sceny.
  // -------------------------------------------------------------------
  function measureSharpness() {
    var vw = scannerVideo.videoWidth;
    var vh = scannerVideo.videoHeight;
    if (!vw || !vh) {
      return 0;
    }
    var side = Math.min(240, vw, vh);
    if (focusCanvas.width !== side) {
      focusCanvas.width = side;
      focusCanvas.height = side;
    }
    try {
      focusCtx.drawImage(scannerVideo, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, side, side);
    } catch (e) {
      return 0;
    }
    var img;
    try {
      img = focusCtx.getImageData(0, 0, side, side);
    } catch (e) {
      return 0;
    }
    var d = img.data;
    var sum = 0;
    var mean = 0;
    var count = 0;
    for (var y = 1; y < side - 2; y += 2) {
      var base = y * side * 4;
      for (var x = 1; x < side - 2; x += 2) {
        var i = base + x * 4;
        var g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
        var iR = i + 8;
        var gR = (d[iR] * 299 + d[iR + 1] * 587 + d[iR + 2] * 114) / 1000;
        var iD = i + side * 8;
        var gD = (d[iD] * 299 + d[iD + 1] * 587 + d[iD + 2] * 114) / 1000;
        var dx = gR - g;
        var dy = gD - g;
        sum += dx * dx + dy * dy;
        mean += g;
        count++;
      }
    }
    if (!count) {
      return 0;
    }
    mean = mean / count;
    return (sum / count) / (mean * mean / 100 + 1);
  }

  // -------------------------------------------------------------------
  //  Dekodowanie jednej klatki (tylko obszar celownika)
  // -------------------------------------------------------------------
  function decodeCurrentFrame() {
    if (!barcodeReader || !ZX) {
      return null;
    }
    var vw = scannerVideo.videoWidth;
    var vh = scannerVideo.videoHeight;
    if (!vw || !vh) {
      return null;
    }
    var regionW = Math.round(vw * 0.9);
    var regionH = Math.round(vh * 0.9);
    var scale = Math.min(1, 720 / Math.max(regionW, regionH));
    var outW = Math.max(2, Math.round(regionW * scale));
    var outH = Math.max(2, Math.round(regionH * scale));
    if (decodeCanvas.width !== outW || decodeCanvas.height !== outH) {
      decodeCanvas.width = outW;
      decodeCanvas.height = outH;
    }
    try {
      decodeCtx.drawImage(scannerVideo, (vw - regionW) / 2, (vh - regionH) / 2, regionW, regionH, 0, 0, outW, outH);
    } catch (e) {
      return null;
    }
    try {
      var source = new ZX.HTMLCanvasElementLuminanceSource(decodeCanvas);
      var bitmap = new ZX.BinaryBitmap(new ZX.HybridBinarizer(source));
      var result = barcodeReader.decode(bitmap, decodeHints);
      return result ? result.getText() : null;
    } catch (e) {
      return null;
    } finally {
      try {
        barcodeReader.reset();
      } catch (e2) {
        // nic - reset jest tylko porzadkowy
      }
    }
  }

  function acceptCode(text) {
    if (!text) {
      return;
    }
    lastDecodedText = text;
    lastGoodTs = Date.now();
    scannedCodeDisplay.textContent = text;
    confirmScanButton.classList.add('ready');
    if (navigator.vibrate) {
      try {
        navigator.vibrate(40);
      } catch (e) {
        // wibracja jest tylko dodatkiem
      }
    }
  }

  // -------------------------------------------------------------------
  //  Autofokus programowy - przemiatanie zakresu i wybor najostrzejszego
  //  ustawienia. Dokladnie to, co robi aparat, gdy sam szuka ostrosci,
  //  tyle ze liczone w przegladarce na srodku kadru.
  // -------------------------------------------------------------------
  function buildFocusCandidates() {
    var base = [0, 0.05, 0.1, 0.2, 0.35, 0.5, 0.75, 1, 1.5, 2, 3, 4.5, 6, 8, 10, 12];
    var out = [];
    for (var i = 0; i < base.length; i++) {
      var v = base[i];
      if (v < focusState.distanceMin) {
        v = focusState.distanceMin;
      }
      if (v > focusState.distanceMax) {
        continue;
      }
      if (out.indexOf(v) === -1) {
        out.push(v);
      }
    }
    if (out.indexOf(focusState.distanceMax) === -1) {
      out.push(focusState.distanceMax);
    }
    return out;
  }

  function autoFocusSweep(fine) {
    if (focusState.busy || !currentTrack || !focusState.manualSupported) {
      return Promise.resolve();
    }
    focusState.busy = true;

    var list;
    if (fine && focusState.best !== null) {
      var span = Math.max(focusState.distanceStep * 6, focusState.distanceMax * 0.08);
      list = [];
      for (var k = -3; k <= 3; k++) {
        var v = focusState.best + k * (span / 3);
        if (v >= focusState.distanceMin && v <= focusState.distanceMax) {
          list.push(Math.round(v * 1000) / 1000);
        }
      }
    } else {
      list = buildFocusCandidates();
    }

    var bestValue = null;
    var bestScore = -1;
    var idx = 0;

    function step() {
      if (!scannerActive || idx >= list.length) {
        return Promise.resolve();
      }
      var value = list[idx++];
      setFocusStatus('Ustawiam ostrość... ' + idx + '/' + list.length);
      return setFocusDistance(value).then(function () {
        return sleep(230);
      }).then(function () {
        var score = measureSharpness();
        lastSharpness = score;
        if (score > bestScore) {
          bestScore = score;
          bestValue = value;
        }
        // przy okazji: ostra klatka moze od razu dac odczyt kodu
        var text = decodeCurrentFrame();
        if (text) {
          acceptCode(text);
        }
        return step();
      });
    }

    return step().then(function () {
      focusState.busy = false;
      focusState.lastActionTs = Date.now();
      if (bestValue === null) {
        return null;
      }
      focusState.best = bestValue;
      focusState.bestScore = bestScore;
      focusRange.value = bestValue;
      return setFocusDistance(bestValue).then(function () {
        setFocusStatus('Ostrość ustawiona automatycznie (' + bestValue + ')');
      });
    }, function () {
      focusState.busy = false;
      focusState.lastActionTs = Date.now();
    });
  }

  function nudgeHardwareFocus() {
    if (!currentTrack) {
      return;
    }
    focusState.lastActionTs = Date.now();
    if (focusState.strategy === 'hw-poi') {
      applyFocusMode('continuous', { pointsOfInterest: [{ x: 0.5, y: 0.5 }] });
    } else if (focusState.strategy === 'hw-single') {
      applyFocusMode('single-shot');
    } else if (focusState.strategy === 'hw-continuous') {
      applyFocusMode('continuous');
    }
  }

  function refocusNow() {
    if (focusState.strategy === 'sw-sweep') {
      autoFocusSweep(false);
    } else if (focusState.strategy !== 'none') {
      setFocusStatus('Wymuszam ostrość na środku kadru...');
      nudgeHardwareFocus();
    }
  }

  function maybeRefocus() {
    var now = Date.now();
    if (lastDecodedText && now - lastGoodTs < 1500) {
      return;
    }
    if (focusState.strategy === 'sw-sweep') {
      if (focusState.busy) {
        return;
      }
      lastSharpness = measureSharpness();
      var quiet = now - focusState.lastActionTs;
      if (focusState.best === null) {
        if (quiet > 700) {
          autoFocusSweep(false);
        }
        return;
      }
      if (quiet > 2500) {
        // obraz wyraznie stracil ostrosc albo od dawna nic nie widac -
        // wtedy pelne przemiatanie, w innym razie tylko dostrojenie
        if (lastSharpness < focusState.bestScore * 0.6 || quiet > 7000) {
          autoFocusSweep(false);
        } else {
          autoFocusSweep(true);
        }
      }
    } else if (focusState.strategy !== 'none') {
      if (now - focusState.lastActionTs > 2000) {
        nudgeHardwareFocus();
      }
    }
  }

  function updateDebug() {
    if (scannerDebugInfo.hidden) {
      return;
    }
    var s = readSettings();
    var lines = [];
    lines.push('strategia: ' + focusState.strategy +
      (focusState.applyVariant >= 0 ? '  wariant=' + focusState.applyVariant : '  wariant=?') +
      (focusState.note ? '  [' + focusState.note + ']' : ''));
    lines.push('ostrość: best=' + (focusState.best === null ? '-' : focusState.best) +
      '  score=' + Math.round(lastSharpness) +
      '  bestScore=' + Math.round(focusState.bestScore));
    lines.push('settings: ' + JSON.stringify(s));
    lines.push('capabilities: ' + JSON.stringify(currentCapabilities));
    scannerDebugInfo.textContent = lines.join('\n');
  }

  function scanTick() {
    if (!scannerActive) {
      return;
    }
    if (!focusState.busy && scannerVideo.readyState >= 2) {
      var text = decodeCurrentFrame();
      if (text) {
        acceptCode(text);
      } else {
        maybeRefocus();
      }
      tickCount++;
      if (tickCount % 4 === 0) {
        updateDebug();
      }
    }
    scanTimer = setTimeout(scanTick, 120);
  }

  function setupTrackControls() {
    currentCapabilities = {};
    if (!currentTrack) {
      return;
    }
    if (typeof currentTrack.getCapabilities === 'function') {
      try {
        currentCapabilities = currentTrack.getCapabilities() || {};
      } catch (e) {
        currentCapabilities = {};
      }
    }
    var settings = readSettings();

    torchButton.hidden = !currentCapabilities.torch;

    var modes = Array.isArray(currentCapabilities.focusMode) ? currentCapabilities.focusMode : [];
    var hasPoi = !!currentCapabilities.pointsOfInterest;

    focusState.applyVariant = -1;
    focusState.best = null;
    focusState.bestScore = 0;
    focusState.note = '';
    focusState.lastActionTs = 0;
    focusState.manualSupported = (modes.indexOf('manual') !== -1) && !!currentCapabilities.focusDistance;

    if (currentCapabilities.focusDistance) {
      var fd = currentCapabilities.focusDistance;
      focusState.distanceMin = (typeof fd.min === 'number' && isFinite(fd.min)) ? fd.min : 0;
      // czesc telefonow z Androidem zglasza absurdalny "max" (blad sterownika
      // kamery) - wtedy trzymamy sie zakresu praktycznego zamiast mu wierzyc
      focusState.distanceMax = (typeof fd.max === 'number' && isFinite(fd.max) && fd.max > 0 && fd.max <= 60) ? fd.max : 12;
      focusState.distanceStep = (typeof fd.step === 'number' && fd.step > 0 && fd.step <= 1) ? fd.step : 0.05;
      focusRange.min = focusState.distanceMin;
      focusRange.max = focusState.distanceMax;
      focusRange.step = focusState.distanceStep;
      focusRange.value = (typeof settings.focusDistance === 'number') ? settings.focusDistance : focusState.distanceMin;
    }

    if (hasPoi && modes.indexOf('continuous') !== -1) {
      focusState.strategy = 'hw-poi';
    } else if (modes.indexOf('continuous') !== -1) {
      focusState.strategy = 'hw-continuous';
    } else if (modes.indexOf('single-shot') !== -1) {
      focusState.strategy = 'hw-single';
    } else if (focusState.manualSupported) {
      focusState.strategy = 'sw-sweep';
    } else {
      focusState.strategy = 'none';
    }

    manualFocusButton.hidden = !focusState.manualSupported;
    afButton.hidden = (focusState.strategy === 'none');
    focusControl.classList.toggle('visible', focusState.manualSupported && manualPanelVisible);

    if (focusState.strategy === 'none') {
      setFocusStatus('Ostrość: automatyka aparatu');
    } else if (focusState.strategy === 'sw-sweep') {
      setFocusStatus('Autofokus programowy - szukam ostrości...');
      autoFocusSweep(false);
    } else {
      setFocusStatus('Ostrość: auto, środek kadru');
      nudgeHardwareFocus();
    }
    updateDebug();
  }

  function waitForVideo() {
    return new Promise(function (resolve) {
      if (scannerVideo.readyState >= 2 && scannerVideo.videoWidth) {
        resolve();
        return;
      }
      var done = false;
      var finish = function () {
        if (!done) {
          done = true;
          resolve();
        }
      };
      scannerVideo.addEventListener('loadedmetadata', finish, { once: true });
      setTimeout(finish, 3000);
    });
  }

  function startCamera() {
    // Wyzsza rozdzielczosc wymusza na Androidzie pelny profil kamery zamiast
    // profilu "podgladowego", w ktorym sterownik czesto w ogole nie rusza
    // ukladem ostrosci
    var constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
      }
    };
    navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
      mediaStream = stream;
      currentTrack = stream.getVideoTracks()[0] || null;
      scannerVideo.srcObject = stream;
      var p = scannerVideo.play();
      return p && p.catch ? p.catch(function () { return null; }) : null;
    }).then(function () {
      return waitForVideo();
    }).then(function () {
      if (!scannerActive) {
        return;
      }
      setupTrackControls();
      scanTick();
    }).catch(function (err) {
      scannedCodeDisplay.textContent = 'Brak dostępu do aparatu.';
      setFocusStatus('Błąd kamery: ' + (err && err.name ? err.name : String(err)));
    });
  }

  function resetControlsUi() {
    torchButton.hidden = true;
    torchButton.classList.remove('active');
    torchOn = false;
    afButton.hidden = true;
    manualFocusButton.hidden = true;
    focusControl.classList.remove('visible');
    manualPanelVisible = false;
    lastDecodedText = null;
    lastGoodTs = 0;
    lastSharpness = 0;
    tickCount = 0;
    focusState.strategy = 'none';
    focusState.manualSupported = false;
    focusState.busy = false;
    focusState.best = null;
    focusState.bestScore = 0;
    focusState.applyVariant = -1;
    focusState.note = '';
    scannedCodeDisplay.textContent = 'Szukam kodu...';
    confirmScanButton.classList.remove('ready');
    setFocusStatus('Uruchamiam aparat...');
  }

  function openScanner() {
    if (!barcodeReader) {
      alert('Skaner kodów nie załadował się (brak połączenia z internetem przy pierwszym uruchomieniu).');
      return;
    }
    resetControlsUi();
    scannerOverlay.classList.add('active');
    scannerActive = true;
    startCamera();
  }

  function closeScanner() {
    scannerActive = false;
    if (scanTimer) {
      clearTimeout(scanTimer);
      scanTimer = null;
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(function (t) {
        try {
          t.stop();
        } catch (e) {
          // strumien i tak zaraz znika
        }
      });
      mediaStream = null;
    }
    scannerVideo.srcObject = null;
    currentTrack = null;
    currentCapabilities = {};
    focusState.busy = false;
    scannerOverlay.classList.remove('active');
  }

  scanButton.addEventListener('click', openScanner);
  scannerCloseButton.addEventListener('click', closeScanner);

  confirmScanButton.addEventListener('click', function () {
    if (!lastDecodedText) {
      return;
    }
    document.getElementById('userInput').value = lastDecodedText;
    closeScanner();
  });

  afButton.addEventListener('click', refocusNow);

  manualFocusButton.addEventListener('click', function () {
    manualPanelVisible = !manualPanelVisible;
    manualFocusButton.classList.toggle('active', manualPanelVisible);
    focusControl.classList.toggle('visible', focusState.manualSupported && manualPanelVisible);
  });

  debugToggleButton.addEventListener('click', function () {
    scannerDebugInfo.hidden = !scannerDebugInfo.hidden;
    debugToggleButton.classList.toggle('active', !scannerDebugInfo.hidden);
    updateDebug();
  });

  torchButton.addEventListener('click', function () {
    if (!currentTrack) {
      return;
    }
    torchOn = !torchOn;
    currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function () {
      torchButton.classList.toggle('active', torchOn);
    }).catch(function (err) {
      torchOn = !torchOn;
      console.log('Latarka niedostępna:', err);
    });
  });

  // Reczne dostrojenie ostrosci - uzywa tego samego, sprawdzonego wariantu
  // zapisu co autofokus programowy. Ruch suwakiem wylacza automat, zeby
  // przemiatanie nie nadpisywalo ustawienia uzytkownika od razu po ruchu.
  focusRange.addEventListener('input', function () {
    if (!currentTrack || !focusState.manualSupported) {
      return;
    }
    var val = parseFloat(focusRange.value);
    focusState.best = val;
    focusState.busy = false;
    focusState.lastActionTs = Date.now();
    setFocusDistance(val).then(function (ok) {
      setFocusStatus(ok ? ('Ostrość ręczna: ' + val) : 'Telefon nie przyjmuje ręcznej ostrości');
      focusState.bestScore = measureSharpness();
    });
  });
</script>
</body>
</html>
