<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Testowa Aplikacja</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TestApp">
<meta name="theme-color" content="#2563eb">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f4f6fb 0%, #e9edf7 100%);
  }
  .container {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px;
    padding-top: max(32px, env(safe-area-inset-top));
    gap: 20px;
  }
  .display-text {
    font-size: 28px;
    font-weight: 600;
    color: #1f2937;
    text-align: center;
    min-height: 40px;
    word-break: break-word;
    max-width: 90%;
  }
  #userInput {
    width: 100%;
    max-width: 320px;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    background: #ffffff;
    outline: none;
  }
  #userInput:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  #clickButton {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #2563eb;
    border: none;
    border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
  }
  #clickButton:active {
    background: #1d4ed8;
    transform: scale(0.98);
  }
  #scanButton {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #16a34a;
    border: none;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  #scanButton:active {
    background: #15803d;
    transform: scale(0.98);
  }

  /* Numer wersji - od razu widac, czy telefon pobral najnowsza wersje */
  #appVersion {
    position: fixed;
    right: max(10px, env(safe-area-inset-right));
    bottom: max(8px, env(safe-area-inset-bottom));
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 0.5px;
    z-index: 10;
    pointer-events: none;
  }

  /* Pelnoekranowy podglad kamery ze skanerem kodow kreskowych */
  #scannerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000;
    z-index: 9999;
    overflow: hidden;
  }
  #scannerOverlay.active {
    display: block;
  }
  #scannerVideo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000000;
  }
  .scannerIconButton {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: #ffffff;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .scannerIconButton[hidden] {
    display: none;
  }
  #scannerTopLeftControls {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    left: 16px;
    display: flex;
    gap: 10px;
    z-index: 3;
  }
  #scannerCloseButton {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 3;
  }
  #scannedCodeDisplay {
    position: absolute;
    top: max(64px, calc(env(safe-area-inset-top) + 48px));
    left: 50%;
    transform: translateX(-50%);
    max-width: 88%;
    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    word-break: break-word;
    z-index: 2;
  }
  #scannedCodeDisplay.found {
    background: rgba(22, 163, 74, 0.85);
  }
  #cameraInfo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(130px, calc(env(safe-area-inset-bottom) + 114px));
    max-width: 88%;
    background: rgba(0, 0, 0, 0.45);
    color: #cbd5e1;
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 12px;
    text-align: center;
    word-break: break-word;
    z-index: 2;
  }
  #scanFrame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78%;
    height: 30%;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 14px;
    pointer-events: none;
    z-index: 1;
  }
  #scanFrame::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 5%;
    right: 5%;
    height: 2px;
    background: rgba(239, 68, 68, 0.75);
    transform: translateY(-50%);
  }
  #confirmScanButton {
    position: absolute;
    bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px));
    left: 50%;
    transform: translateX(-50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    border: 2px solid rgba(255, 255, 255, 0.65);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    z-index: 3;
  }
  #confirmScanButton.ready {
    opacity: 1;
    pointer-events: auto;
  }
  #confirmScanButton svg {
    width: 34px;
    height: 34px;
  }
</style>
</head>
<body>
<div class="container">
  <div id="displayText" class="display-text">Witaj!</div>
  <input type="text" id="userInput" placeholder="Wpisz tutaj tekst..." autocomplete="off" autocapitalize="off">
  <button id="clickButton">Kliknij mnie</button>
  <button id="scanButton">📷 Skanuj kod kreskowy</button>
</div>

<div id="appVersion">v9</div>

<div id="scannerOverlay">
  <video id="scannerVideo" autoplay playsinline muted></video>

  <div id="scanFrame"></div>

  <div id="scannerTopLeftControls">
    <button id="switchCameraButton" class="scannerIconButton" aria-label="Zmień aparat" hidden>🔄</button>
  </div>
  <button id="scannerCloseButton" class="scannerIconButton" aria-label="Zamknij skaner">✕</button>

  <div id="scannedCodeDisplay">Szukam kodu...</div>

  <div id="cameraInfo">Uruchamiam aparat...</div>

  <button id="confirmScanButton" aria-label="Wpisz odczytany kod">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="5" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="7" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="10" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="12" y="4" width="2.2" height="16" fill="#ffffff"/>
      <rect x="15.5" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="17.5" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="20.5" y="4" width="1.2" height="16" fill="#ffffff"/>
    </svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.0/umd/index.min.js"></script>
<script>
  var APP_VERSION = 'v9';
  document.getElementById('appVersion').textContent = APP_VERSION;

  document.getElementById('clickButton').addEventListener('click', function () {
    var val = document.getElementById('userInput').value;
    document.getElementById('displayText').textContent = val.length > 0 ? val : '(puste pole)';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function (err) {
        console.log('Rejestracja service workera nie powiodła się:', err);
      });
    });
  }

  var scannerOverlay = document.getElementById('scannerOverlay');
  var scannerVideo = document.getElementById('scannerVideo');
  var scannedCodeDisplay = document.getElementById('scannedCodeDisplay');
  var cameraInfo = document.getElementById('cameraInfo');
  var confirmScanButton = document.getElementById('confirmScanButton');
  var scanButton = document.getElementById('scanButton');
  var scannerCloseButton = document.getElementById('scannerCloseButton');
  var switchCameraButton = document.getElementById('switchCameraButton');

  // =====================================================================
  //  ROZPOZNAWANIE KODU Z KLATKI  (ta czesc dziala poprawnie - bez zmian)
  //
  //  Klatka z podgladu trafia na canvas, a ZXing dekoduje ja tak samo jak
  //  zwykle zdjecie. Hint TRY_HARDER sprawia, ze przy kodach 1D ZXing probuje
  //  takze obrazu obroconego o 90 stopni, wiec kod czytany jest w poziomie
  //  i w pionie.
  // =====================================================================
  var ZX = (typeof ZXing !== 'undefined') ? ZXing : null;
  var barcodeReader = null;
  var decodeHints = null;

  if (ZX) {
    decodeHints = new Map();
    decodeHints.set(ZX.DecodeHintType.TRY_HARDER, true);
    decodeHints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [
      ZX.BarcodeFormat.EAN_13,
      ZX.BarcodeFormat.EAN_8,
      ZX.BarcodeFormat.UPC_A,
      ZX.BarcodeFormat.UPC_E,
      ZX.BarcodeFormat.CODE_128,
      ZX.BarcodeFormat.CODE_39,
      ZX.BarcodeFormat.CODE_93,
      ZX.BarcodeFormat.ITF,
      ZX.BarcodeFormat.CODABAR,
      ZX.BarcodeFormat.QR_CODE,
      ZX.BarcodeFormat.DATA_MATRIX
    ]);
    barcodeReader = new ZX.MultiFormatReader();
    barcodeReader.setHints(decodeHints);
  }

  var decodeCanvas = document.createElement('canvas');
  var decodeCtx = decodeCanvas.getContext('2d', { willReadFrequently: true });

  function decodeCurrentFrame() {
    if (!barcodeReader || !ZX) {
      return null;
    }
    var vw = scannerVideo.videoWidth;
    var vh = scannerVideo.videoHeight;
    if (!vw || !vh) {
      return null;
    }
    var regionW = Math.round(vw * 0.9);
    var regionH = Math.round(vh * 0.9);
    var scale = Math.min(1, 720 / Math.max(regionW, regionH));
    var outW = Math.max(2, Math.round(regionW * scale));
    var outH = Math.max(2, Math.round(regionH * scale));
    if (decodeCanvas.width !== outW || decodeCanvas.height !== outH) {
      decodeCanvas.width = outW;
      decodeCanvas.height = outH;
    }
    try {
      decodeCtx.drawImage(scannerVideo, (vw - regionW) / 2, (vh - regionH) / 2, regionW, regionH, 0, 0, outW, outH);
    } catch (e) {
      return null;
    }
    try {
      var source = new ZX.HTMLCanvasElementLuminanceSource(decodeCanvas);
      var bitmap = new ZX.BinaryBitmap(new ZX.HybridBinarizer(source));
      var result = barcodeReader.decode(bitmap, decodeHints);
      return result ? result.getText() : null;
    } catch (e) {
      return null;
    } finally {
      try {
        barcodeReader.reset();
      } catch (e2) {
        // reset jest tylko porzadkowy
      }
    }
  }

  // =====================================================================
  //  OBSLUGA APARATU - napisana od nowa
  //
  //  Zasada: zadnego recznego sterowania ostroscia. Otwieramy wlasciwy
  //  obiektyw i prosimy kamere o jej wlasny autofokus ciagly z punktem
  //  ostrosci na srodku kadru. Nic wiecej.
  //
  //  Dlaczego wybor obiektywu ma znaczenie: na wielu Androidach
  //  "facingMode: environment" trafia w obiektyw ultraszerokokatny, makro
  //  albo pomocniczy, a te bardzo czesto NIE MAJA w ogole ukladu autofokusu
  //  (staly focus). Wtedy zaden kod JavaScript nie wyostrzy obrazu - trzeba
  //  po prostu otworzyc glowny aparat. Na Androidzie rozpoznajemy go po
  //  etykiecie "camera2 0, facing back".
  // =====================================================================
  var mediaStream = null;
  var videoTrack = null;
  var cameraList = [];
  var cameraIndex = 0;
  var scannerActive = false;
  var scanTimer = null;
  var lastDecodedText = null;
  var singleShotNeeded = false;
  var lastSingleShotTs = 0;

  function labelOf(dev) {
    return (dev && dev.label) ? dev.label : '';
  }

  function isBackCamera(label) {
    var l = label.toLowerCase();
    if (l.indexOf('front') !== -1 || l.indexOf('user') !== -1 || l.indexOf('przedni') !== -1) {
      return false;
    }
    return l.indexOf('back') !== -1 || l.indexOf('rear') !== -1 ||
           l.indexOf('environment') !== -1 || l.indexOf('tyl') !== -1;
  }

  function cameraScore(label) {
    var l = label.toLowerCase();
    var score = 0;
    var m = l.match(/camera2\s+(\d+)/);
    if (m) {
      score += (m[1] === '0') ? 40 : -parseInt(m[1], 10) * 4;
    }
    if (l.indexOf('ultra') !== -1) {
      score -= 40;
    }
    if (l.indexOf('tele') !== -1) {
      score -= 20;
    }
    if (l.indexOf('macro') !== -1) {
      score -= 30;
    }
    if (l.indexOf('depth') !== -1 || l.indexOf('mono') !== -1 || l.indexOf('bokeh') !== -1) {
      score -= 60;
    }
    return score;
  }

  function currentDeviceId() {
    if (!videoTrack || typeof videoTrack.getSettings !== 'function') {
      return '';
    }
    try {
      return videoTrack.getSettings().deviceId || '';
    } catch (e) {
      return '';
    }
  }

  function stopStream() {
    if (mediaStream) {
      var tracks = mediaStream.getTracks();
      for (var i = 0; i < tracks.length; i++) {
        try {
          tracks[i].stop();
        } catch (e) {
          // strumien i tak zaraz przestaje istniec
        }
      }
      mediaStream = null;
    }
    videoTrack = null;
    scannerVideo.srcObject = null;
  }

  function waitForVideo() {
    return new Promise(function (resolve) {
      if (scannerVideo.readyState >= 2 && scannerVideo.videoWidth) {
        resolve();
        return;
      }
      var done = false;
      var finish = function () {
        if (!done) {
          done = true;
          resolve();
        }
      };
      scannerVideo.addEventListener('loadedmetadata', finish, { once: true });
      setTimeout(finish, 3000);
    });
  }

  // Autofokus: prosimy kamere o jej wlasny tryb ciagly (a gdy go nie ma - o
  // pojedyncze wyzwolenie) i o punkt ostrosci na srodku kadru. Trybu "manual"
  // nie ustawiamy nigdy - to on wczesniej blokowal telefon na jednej odleglosci.
  function enableAutoFocus() {
    singleShotNeeded = false;
    lastSingleShotTs = 0;
    if (!videoTrack || typeof videoTrack.applyConstraints !== 'function') {
      return;
    }
    var caps = {};
    if (typeof videoTrack.getCapabilities === 'function') {
      try {
        caps = videoTrack.getCapabilities() || {};
      } catch (e) {
        caps = {};
      }
    }
    var modes = Array.isArray(caps.focusMode) ? caps.focusMode : [];
    var target = null;
    if (modes.indexOf('continuous') !== -1) {
      target = 'continuous';
    } else if (modes.indexOf('single-shot') !== -1) {
      target = 'single-shot';
      singleShotNeeded = true;
    }
    if (!target) {
      // kamera nie udostepnia sterowania ostroscia przez WWW - zostaje jej
      // wlasna automatyka, ktora jest wtedy i tak jedynym, co dziala
      return;
    }
    var wish = { focusMode: target };
    if (caps.pointsOfInterest) {
      wish.pointsOfInterest = [{ x: 0.5, y: 0.5 }];
    }
    videoTrack.applyConstraints({ advanced: [wish] }).catch(function () {
      // prosba best-effort - brak reakcji nie jest bledem
    });
  }

  function updateCameraInfo() {
    var settings = {};
    if (videoTrack && typeof videoTrack.getSettings === 'function') {
      try {
        settings = videoTrack.getSettings() || {};
      } catch (e) {
        settings = {};
      }
    }
    var parts = [APP_VERSION];
    if (cameraList.length > 1) {
      parts.push('aparat ' + (cameraIndex + 1) + '/' + cameraList.length);
    }
    var label = labelOf(cameraList[cameraIndex]);
    if (label) {
      parts.push(label.length > 32 ? label.substring(0, 32) + '...' : label);
    }
    if (settings.width && settings.height) {
      parts.push(settings.width + 'x' + settings.height);
    }
    cameraInfo.textContent = parts.join(' | ');
  }

  function openCamera(deviceId) {
    stopStream();
    var videoWish = {
      width: { ideal: 1280 },
      height: { ideal: 720 },
      frameRate: { ideal: 30 }
    };
    if (deviceId) {
      videoWish.deviceId = { exact: deviceId };
    } else {
      videoWish.facingMode = { ideal: 'environment' };
    }
    return navigator.mediaDevices.getUserMedia({ video: videoWish }).then(function (stream) {
      mediaStream = stream;
      videoTrack = stream.getVideoTracks()[0] || null;
      scannerVideo.srcObject = stream;
      var p = scannerVideo.play();
      if (p && p.catch) {
        p.catch(function () {
          // odtwarzanie i tak startuje z atrybutu autoplay
        });
      }
      return waitForVideo();
    }).then(function () {
      enableAutoFocus();
      updateCameraInfo();
      return true;
    });
  }

  // Lista aparatow tylnych - budowana raz, po uzyskaniu zgody (dopiero wtedy
  // przegladarka podaje etykiety). Gdy etykiety sa androidowe i wybrany
  // obiektyw nie jest glownym, przelaczamy sie na glowny automatycznie.
  // Na iOS nie kombinujemy - tam facingMode trafia dobrze.
  function buildCameraList() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      return Promise.resolve(null);
    }
    return navigator.mediaDevices.enumerateDevices().then(function (list) {
      var vids = [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].kind === 'videoinput') {
          vids.push(list[i]);
        }
      }
      var back = [];
      for (var j = 0; j < vids.length; j++) {
        if (isBackCamera(labelOf(vids[j]))) {
          back.push(vids[j]);
        }
      }
      cameraList = back.length ? back : vids;
      switchCameraButton.hidden = cameraList.length < 2;

      var curId = currentDeviceId();
      cameraIndex = 0;
      for (var k = 0; k < cameraList.length; k++) {
        if (cameraList[k].deviceId && cameraList[k].deviceId === curId) {
          cameraIndex = k;
        }
      }

      var androidLabels = false;
      for (var n = 0; n < cameraList.length; n++) {
        if (/camera2\s+\d+/i.test(labelOf(cameraList[n]))) {
          androidLabels = true;
        }
      }
      if (!androidLabels || cameraList.length < 2) {
        updateCameraInfo();
        return null;
      }

      var bestIdx = 0;
      for (var m = 1; m < cameraList.length; m++) {
        if (cameraScore(labelOf(cameraList[m])) > cameraScore(labelOf(cameraList[bestIdx]))) {
          bestIdx = m;
        }
      }
      if (bestIdx === cameraIndex || !cameraList[bestIdx].deviceId) {
        updateCameraInfo();
        return null;
      }
      cameraIndex = bestIdx;
      return openCamera(cameraList[bestIdx].deviceId);
    }, function () {
      return null;
    });
  }

  function showCode(text) {
    lastDecodedText = text;
    scannedCodeDisplay.textContent = text;
    scannedCodeDisplay.classList.add('found');
    confirmScanButton.classList.add('ready');
    if (navigator.vibrate) {
      try {
        navigator.vibrate(40);
      } catch (e) {
        // wibracja jest tylko dodatkiem
      }
    }
  }

  function retriggerSingleShot() {
    var now = Date.now();
    if (now - lastSingleShotTs < 1500 || !videoTrack) {
      return;
    }
    lastSingleShotTs = now;
    videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }).catch(function () {
      // best-effort
    });
  }

  function scanTick() {
    if (!scannerActive) {
      return;
    }
    if (scannerVideo.readyState >= 2) {
      var text = decodeCurrentFrame();
      if (text) {
        showCode(text);
      } else if (singleShotNeeded) {
        retriggerSingleShot();
      }
    }
    scanTimer = setTimeout(scanTick, 110);
  }

  function openScanner() {
    if (!barcodeReader) {
      alert('Skaner kodów nie załadował się (brak połączenia z internetem przy pierwszym uruchomieniu).');
      return;
    }
    lastDecodedText = null;
    scannedCodeDisplay.textContent = 'Szukam kodu...';
    scannedCodeDisplay.classList.remove('found');
    confirmScanButton.classList.remove('ready');
    cameraInfo.textContent = 'Uruchamiam aparat...';
    switchCameraButton.hidden = cameraList.length < 2;
    scannerOverlay.classList.add('active');
    scannerActive = true;

    var startId = (cameraList.length && cameraList[cameraIndex]) ? cameraList[cameraIndex].deviceId : null;
    openCamera(startId).then(function () {
      if (!cameraList.length) {
        return buildCameraList();
      }
      return null;
    }).then(function () {
      if (scannerActive) {
        updateCameraInfo();
        scanTick();
      }
    }).catch(function (err) {
      scannedCodeDisplay.textContent = 'Brak dostępu do aparatu.';
      cameraInfo.textContent = 'Błąd: ' + ((err && err.name) ? err.name : String(err));
    });
  }

  function closeScanner() {
    scannerActive = false;
    if (scanTimer) {
      clearTimeout(scanTimer);
      scanTimer = null;
    }
    stopStream();
    scannerOverlay.classList.remove('active');
  }

  function switchCamera() {
    if (cameraList.length < 2 || !scannerActive) {
      return;
    }
    cameraIndex = (cameraIndex + 1) % cameraList.length;
    scannedCodeDisplay.textContent = 'Szukam kodu...';
    scannedCodeDisplay.classList.remove('found');
    confirmScanButton.classList.remove('ready');
    lastDecodedText = null;
    cameraInfo.textContent = 'Przełączam aparat...';
    openCamera(cameraList[cameraIndex].deviceId).catch(function () {
      cameraInfo.textContent = 'Nie udało się otworzyć tego aparatu';
    });
  }

  scanButton.addEventListener('click', openScanner);
  scannerCloseButton.addEventListener('click', closeScanner);
  switchCameraButton.addEventListener('click', switchCamera);

  confirmScanButton.addEventListener('click', function () {
    if (!lastDecodedText) {
      return;
    }
    document.getElementById('userInput').value = lastDecodedText;
    closeScanner();
  });
</script>
