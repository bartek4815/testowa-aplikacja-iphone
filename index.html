<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Testowa Aplikacja</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TestApp">
<meta name="theme-color" content="#2563eb">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f4f6fb 0%, #e9edf7 100%);
  }
  .container {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px;
    padding-top: max(32px, env(safe-area-inset-top));
    gap: 20px;
  }
  .display-text {
    font-size: 28px;
    font-weight: 600;
    color: #1f2937;
    text-align: center;
    min-height: 40px;
    word-break: break-word;
    max-width: 90%;
  }
  #userInput {
    width: 100%;
    max-width: 320px;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    background: #ffffff;
    outline: none;
  }
  #userInput:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  #clickButton {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #2563eb;
    border: none;
    border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
  }
  #clickButton:active {
    background: #1d4ed8;
    transform: scale(0.98);
  }
  #scanButton {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    background: #16a34a;
    border: none;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  #scanButton:active {
    background: #15803d;
    transform: scale(0.98);
  }

  /* Pelnoekranowy podglad kamery ze skanerem kodow kreskowych */
  #scannerOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000;
    z-index: 9999;
    overflow: hidden;
  }
  #scannerOverlay.active {
    display: block;
  }
  #scannerVideo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000000;
  }
  .scannerIconButton {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: #ffffff;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .scannerIconButton.active {
    background: rgba(250, 204, 21, 0.85);
    color: #1f2937;
  }
  .scannerIconButton[hidden] {
    display: none;
  }
  #scannerTopLeftControls {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    left: 16px;
    display: flex;
    gap: 10px;
    z-index: 3;
  }
  #scannerCloseButton {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 3;
  }
  #scannedCodeDisplay {
    position: absolute;
    top: max(64px, calc(env(safe-area-inset-top) + 48px));
    left: 50%;
    transform: translateX(-50%);
    max-width: 88%;
    background: rgba(0, 0, 0, 0.55);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    word-break: break-word;
    z-index: 2;
  }
  #zoomControl {
    display: none;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(140px, calc(env(safe-area-inset-bottom) + 124px));
    width: 80%;
    max-width: 320px;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 14px;
    border-radius: 20px;
    z-index: 2;
  }
  #zoomControl.visible {
    display: flex;
  }
  #zoomControl span {
    color: #ffffff;
    font-size: 14px;
  }
  #zoomRange {
    flex: 1;
  }
  #confirmScanButton {
    position: absolute;
    bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px));
    left: 50%;
    transform: translateX(-50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    border: 2px solid rgba(255, 255, 255, 0.65);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    z-index: 3;
  }
  #confirmScanButton.ready {
    opacity: 1;
    pointer-events: auto;
  }
  #confirmScanButton svg {
    width: 34px;
    height: 34px;
  }
  .focusRipple {
    position: absolute;
    width: 64px;
    height: 64px;
    margin-left: -32px;
    margin-top: -32px;
    border: 2px solid rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    animation: focusRippleAnim 0.6s ease-out forwards;
  }
  @keyframes focusRippleAnim {
    0% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.85); opacity: 0; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="displayText" class="display-text">Witaj!</div>
  <input type="text" id="userInput" placeholder="Wpisz tutaj tekst..." autocomplete="off" autocapitalize="off">
  <button id="clickButton">Kliknij mnie</button>
  <button id="scanButton">📷 Skanuj kod kreskowy</button>
</div>

<div id="scannerOverlay">
  <video id="scannerVideo" autoplay playsinline muted></video>

  <div id="scannerTopLeftControls">
    <button id="torchButton" class="scannerIconButton" aria-label="Wlacz/wylacz latarke" hidden>🔦</button>
    <button id="lensSwitchButton" class="scannerIconButton" aria-label="Zmien obiektyw" hidden>🔁</button>
  </div>
  <button id="scannerCloseButton" class="scannerIconButton" aria-label="Zamknij skaner">✕</button>

  <div id="scannedCodeDisplay">Szukam kodu...</div>

  <div id="zoomControl">
    <span>🔍-</span>
    <input type="range" id="zoomRange" min="1" max="1" step="0.1" value="1">
    <span>🔍+</span>
  </div>

  <button id="confirmScanButton" aria-label="Wpisz odczytany kod">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="5" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="7" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="10" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="12" y="4" width="2.2" height="16" fill="#ffffff"/>
      <rect x="15.5" y="4" width="0.8" height="16" fill="#ffffff"/>
      <rect x="17.5" y="4" width="1.6" height="16" fill="#ffffff"/>
      <rect x="20.5" y="4" width="1.2" height="16" fill="#ffffff"/>
    </svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.0/umd/index.min.js"></script>
<script>
  document.getElementById('clickButton').addEventListener('click', function () {
    var val = document.getElementById('userInput').value;
    document.getElementById('displayText').textContent = val.length > 0 ? val : '(puste pole)';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function (err) {
        console.log('Rejestracja service workera nie powiodla sie:', err);
      });
    });
  }

  // --- Skaner kodow kreskowych ---
  var scannerOverlay = document.getElementById('scannerOverlay');
  var scannerVideo = document.getElementById('scannerVideo');
  var scannedCodeDisplay = document.getElementById('scannedCodeDisplay');
  var confirmScanButton = document.getElementById('confirmScanButton');
  var scanButton = document.getElementById('scanButton');
  var scannerCloseButton = document.getElementById('scannerCloseButton');
  var torchButton = document.getElementById('torchButton');
  var lensSwitchButton = document.getElementById('lensSwitchButton');
  var zoomControl = document.getElementById('zoomControl');
  var zoomRange = document.getElementById('zoomRange');

  var zxingHints = null;
  if (typeof ZXing !== 'undefined') {
    zxingHints = new Map();
    // TRY_HARDER: dokladniejsza analiza klatki, lepiej radzi sobie z przekrzywionymi/skosnymi kodami
    zxingHints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  }
  var codeReader = (typeof ZXing !== 'undefined') ? new ZXing.BrowserMultiFormatReader(zxingHints) : null;
  var lastDecodedText = null;
  var currentTrack = null;
  var currentCapabilities = null;
  var torchOn = false;
  var backCameraDevices = [];
  var currentDeviceIndex = 0;
  var supportsManualFocus = false;
  var supportsSingleShotFocus = false;

  function resetControlsUi() {
    torchButton.hidden = true;
    torchButton.classList.remove('active');
    torchOn = false;
    lensSwitchButton.hidden = true;
    zoomControl.classList.remove('visible');
    supportsManualFocus = false;
    supportsSingleShotFocus = false;
  }

  function setupTrackControls() {
    if (!scannerVideo.srcObject) {
      return;
    }
    var tracks = scannerVideo.srcObject.getVideoTracks();
    currentTrack = tracks[0] || null;
    if (!currentTrack || typeof currentTrack.getCapabilities !== 'function') {
      return;
    }
    currentCapabilities = currentTrack.getCapabilities();

    // Latarka - dziala glownie na Androidzie/Chrome, iOS Safari nie udostepnia tego z poziomu strony WWW
    if (currentCapabilities.torch) {
      torchButton.hidden = false;
    }

    // Zoom - suwak pokazuje sie tylko gdy telefon/przegladarka zglasza taka mozliwosc
    if (currentCapabilities.zoom) {
      zoomRange.min = currentCapabilities.zoom.min;
      zoomRange.max = currentCapabilities.zoom.max;
      zoomRange.step = currentCapabilities.zoom.step || 0.1;
      zoomRange.value = currentTrack.getSettings().zoom || currentCapabilities.zoom.min;
      zoomControl.classList.add('visible');
    }

    // Reczne ogniskowanie po tapnieciu - wsparcie eksperymentalne, glownie Android/Chrome
    if (Array.isArray(currentCapabilities.focusMode)) {
      supportsManualFocus = currentCapabilities.focusMode.indexOf('manual') !== -1;
      supportsSingleShotFocus = currentCapabilities.focusMode.indexOf('single-shot') !== -1;
    }
  }

  function listBackCameras() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      return Promise.resolve([]);
    }
    return navigator.mediaDevices.enumerateDevices().then(function (devices) {
      var videoInputs = devices.filter(function (d) { return d.kind === 'videoinput'; });
      var backOnly = videoInputs.filter(function (d) {
        return !/front|przod|user/i.test(d.label);
      });
      return backOnly.length > 0 ? backOnly : videoInputs;
    });
  }

  function startScanning(deviceId) {
    if (!codeReader) {
      return;
    }
    lastDecodedText = null;
    scannedCodeDisplay.textContent = 'Szukam kodu...';
    confirmScanButton.classList.remove('ready');

    var constraints = deviceId
      ? { video: { deviceId: { exact: deviceId } } }
      : { video: { facingMode: { ideal: 'environment' } } };

    codeReader.decodeFromConstraints(constraints, 'scannerVideo', function (result, err) {
      if (result) {
        lastDecodedText = result.getText();
        scannedCodeDisplay.textContent = lastDecodedText;
        confirmScanButton.classList.add('ready');
      }
    }).catch(function (err) {
      scannedCodeDisplay.textContent = 'Brak dostepu do aparatu.';
      console.log('Blad uruchomienia kamery:', err);
    });
  }

  function openScanner() {
    if (!codeReader) {
      alert('Skaner kodow nie zaladowal sie (brak polaczenia z internetem przy pierwszym uruchomieniu).');
      return;
    }
    resetControlsUi();
    scannerOverlay.classList.add('active');
    startScanning(null);

    listBackCameras().then(function (cams) {
      backCameraDevices = cams;
      currentDeviceIndex = 0;
      lensSwitchButton.hidden = cams.length < 2;
    });
  }

  function closeScanner() {
    if (codeReader) {
      codeReader.reset();
    }
    scannerOverlay.classList.remove('active');
    currentTrack = null;
    currentCapabilities = null;
  }

  scannerVideo.addEventListener('loadedmetadata', function () {
    setupTrackControls();
  });

  scanButton.addEventListener('click', openScanner);
  scannerCloseButton.addEventListener('click', closeScanner);

  confirmScanButton.addEventListener('click', function () {
    if (!lastDecodedText) {
      return;
    }
    document.getElementById('userInput').value = lastDecodedText;
    closeScanner();
  });

  torchButton.addEventListener('click', function () {
    if (!currentTrack) {
      return;
    }
    torchOn = !torchOn;
    currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).then(function () {
      torchButton.classList.toggle('active', torchOn);
    }).catch(function (err) {
      torchOn = !torchOn;
      console.log('Latarka niedostepna:', err);
    });
  });

  lensSwitchButton.addEventListener('click', function () {
    if (backCameraDevices.length < 2) {
      return;
    }
    currentDeviceIndex = (currentDeviceIndex + 1) % backCameraDevices.length;
    if (codeReader) {
      codeReader.reset();
    }
    startScanning(backCameraDevices[currentDeviceIndex].deviceId);
  });

  zoomRange.addEventListener('input', function () {
    if (!currentTrack) {
      return;
    }
    var val = parseFloat(zoomRange.value);
    currentTrack.applyConstraints({ advanced: [{ zoom: val }] }).catch(function (err) {
      console.log('Zoom niedostepny:', err);
    });
  });

  // Tap-to-focus: tapniecie na podglad probuje ustawic ognisko w tym miejscu
  // (wsparcie eksperymentalne, glownie Android/Chrome; na iOS to zwykle no-op,
  // bo Safari sam dobrze radzi sobie z autofokusem)
  scannerVideo.addEventListener('click', function (e) {
    var rect = scannerVideo.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width;
    var y = (e.clientY - rect.top) / rect.height;

    var ripple = document.createElement('div');
    ripple.className = 'focusRipple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    scannerOverlay.appendChild(ripple);
    setTimeout(function () { ripple.remove(); }, 650);

    if (!currentTrack) {
      return;
    }
    if (supportsManualFocus) {
      currentTrack.applyConstraints({
        advanced: [{ focusMode: 'manual', pointsOfInterest: [{ x: x, y: y }] }]
      }).catch(function (err) { console.log('Reczny fokus niedostepny:', err); });
    } else if (supportsSingleShotFocus) {
      currentTrack.applyConstraints({
        advanced: [{ pointsOfInterest: [{ x: x, y: y }], focusMode: 'single-shot' }]
      }).catch(function (err) { console.log('Fokus jednorazowy niedostepny:', err); });
    }
  });
</script>
</body>
</html>
